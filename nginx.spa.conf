server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
